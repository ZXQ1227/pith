name: Build and Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          swift --version

      - name: Build DMG
        run: bash build-dmg.sh "$GITHUB_WORKSPACE/Pith.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: Pith.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pith.dmg
          generate_release_notes: true

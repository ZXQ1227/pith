name: Build and Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          swift --version

      - name: Build DMG
        run: |
          sw_vers
          mkdir -p dist
          bash build-dmg.sh "$GITHUB_WORKSPACE/dist/Pith.dmg" 2>&1 | tee build.log
          if [ ! -s "$GITHUB_WORKSPACE/dist/Pith.dmg" ]; then
            echo "::error::DMG missing after successful build!"
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/dist/Pith.dmg" 2>&1 | while IFS= read -r line; do
            echo "::notice::dmg: $line"
          done

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pith.dmg
          generate_release_notes: true

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: dist/Pith.dmg
          if-no-files-found: error

      - name: Dump diagnostics as annotations
        if: failure()
        run: |
          {
            echo "pwd: $(pwd)"
            echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
            echo "--- ls -la workspace ---"
            ls -la "$GITHUB_WORKSPACE" || true
            echo "--- ls -la dist ---"
            ls -la "$GITHUB_WORKSPACE/dist" || true
            echo "--- find dmg under home ---"
            find "$HOME" -maxdepth 6 -name '*.dmg' 2>/dev/null | head -20
            echo "--- build.log tail ---"
            tail -40 build.log 2>/dev/null || echo "(no build.log)"
          } 2>&1 | while IFS= read -r line; do
            echo "::warning::diag: $line"
          done

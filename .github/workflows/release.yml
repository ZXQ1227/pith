name: Build and Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    # macos-26 ships Xcode 26 (Swift 6.3); macos-15's Swift 6.1 does not
    # support the 'isolated deinit' feature used in PithApp sources.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          swift --version

      - name: Build DMG
        run: |
          sw_vers
          mkdir -p dist
          bash build-dmg.sh "$GITHUB_WORKSPACE/dist/Pith.dmg" 2>&1 | tee build.log
          if [ ! -s "$GITHUB_WORKSPACE/dist/Pith.dmg" ]; then
            echo "::error::DMG missing after successful build!"
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/dist/Pith.dmg" 2>&1 | while IFS= read -r line; do
            echo "::notice::dmg: $line"
          done

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pith.dmg
          generate_release_notes: true

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: dist/Pith.dmg
          if-no-files-found: error

      - name: Dump diagnostics as annotations
        if: failure()
        run: |
          echo "::warning::diag: pwd=$(pwd) ws=$GITHUB_WORKSPACE"
          echo "::warning::diag: ls-workspace: $(ls "$GITHUB_WORKSPACE" 2>&1 | tr '\n' ' ')"
          echo "::warning::diag: ls-dist: $(ls -la "$GITHUB_WORKSPACE/dist" 2>&1 | tr '\n' ' ')"
          echo "::notice::diag: find-dmg: $(find "$GITHUB_WORKSPACE" -name '*.dmg' 2>/dev/null | tr '\n' ' ')"
          echo "::notice::diag: find-dmg-tmp: $(find /private/tmp -maxdepth 4 -name '*.dmg' 2>/dev/null | tr '\n' ' ')"
          echo "::notice::diag: find-work: $(find "$GITHUB_WORKSPACE" -maxdepth 2 -newer "$GITHUB_WORKSPACE/Package.swift" -type f 2>/dev/null | head -20 | tr '\n' ' ')"
          tail -n 30 build.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::log: $line"
          done

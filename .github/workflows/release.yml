name: Build and Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          swift --version

      - name: Build DMG
        run: |
          sw_vers
          bash build-dmg.sh "$GITHUB_WORKSPACE/Pith.dmg" 2>&1 | tee build.log

      - name: Diagnose on failure
        if: failure()
        run: |
          {
            echo "## Build DMG failure log"
            echo ""
            echo '```'
            tail -100 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Known flaky bug on arm64 macOS runners (~1/3 CreateArtifact timeouts,
      # actions/upload-artifact#569). Retry up to 3 times with overwrite to
      # clear any half-created artifact from a failed attempt.
      - name: Upload artifact
        id: upload-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: Pith.dmg
          if-no-files-found: error

      - name: Retry artifact upload (attempt 2)
        if: steps.upload-artifact.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: Pith.dmg
          if-no-files-found: error
          overwrite: true

      - name: Retry artifact upload (attempt 3)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: Pith.dmg
          if-no-files-found: error
          overwrite: true

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pith.dmg
          generate_release_notes: true

name: Build and Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          swift --version

      - name: Build DMG
        run: |
          sw_vers
          mkdir -p dist
          bash build-dmg.sh "$GITHUB_WORKSPACE/dist/Pith.dmg" 2>&1 | tee build.log

      - name: Dump diagnostics to ci-debug branch
        if: always()
        run: |
          {
            echo "=== pwd ==="
            pwd
            echo "=== GITHUB_WORKSPACE ==="
            echo "$GITHUB_WORKSPACE"
            echo "=== ls -la workspace ==="
            ls -la "$GITHUB_WORKSPACE" || true
            echo "=== ls -la dist ==="
            ls -la "$GITHUB_WORKSPACE/dist" || true
            echo "=== find dmg under home ==="
            find "$HOME" -maxdepth 6 -name '*.dmg' 2>/dev/null || true
            echo "=== find dmg under private/tmp ==="
            find /private/tmp -maxdepth 4 -name '*.dmg' 2>/dev/null || true
            echo "=== build.log tail ==="
            tail -80 build.log 2>/dev/null || echo "(no build.log)"
          } > ci-debug.log
          git config user.name "ci-debug"
          git config user.email "action@github.com"
          git add ci-debug.log
          git commit -m "ci debug diagnostics [skip ci]" || true
          git push origin HEAD:ci-debug --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pith-dmg
          path: dist/Pith.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pith.dmg
          generate_release_notes: true
